[package]
name = "loca"
version = "0.1.0"
description = "A local-first modular AI client"
authors = ["rzkyif"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# Runtime OS detection so the UI bootstrap can pick the desktop vs mobile
# Platform impl (lib/platform/select.ts). Builds on every target.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }
tauri-plugin-dialog = "2.7.1"
image = "0.25"
base64 = "0.22"
keyring-core = "1"
thiserror = "2"
# Per-process CPU / memory for the Services field's "Main Application" row.
sysinfo = "0.39"
# Pinned core networking (see commands/net.rs). reqwest + tokio-tungstenite both
# terminate TLS with a custom rustls verifier on the cert SPKI pin.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = "0.23"
# Public-CA root set for the `webpki` trust mode (a Core served over HTTPS behind
# a terminating reverse proxy). Restricting to public roots also means an
# OS-installed interception root is NOT auto-trusted for pairing.
webpki-roots = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
x509-parser = "0.18"
sha2 = "0.11"
# Logging: `log` facade + fern sinks (stdout + size-capped file), with `regex`
# for secret scrubbing and `chrono` for ISO-8601 file timestamps. See logging.rs.
log = "0.4"
fern = "0.7"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
file-rotate = "0.8"

# macOS uses the "legacy keychain" store (available to unsigned/ad-hoc builds);
# iOS has only the "protected data" store, and the crate hard-requires the
# `protected` feature there (the `keychain` module is macOS-only).
# The embedded Core. On a phone there is no separate `loca-core` process to talk
# to, so the app links the real Core and drives it in process (commands/core.rs).
#
# **Gated to mobile, and the gate is what keeps desktop clean.** This edge is the
# only thing that would pull the Core (and eventually llama.cpp and sherpa-onnx)
# into an archive, because this crate is already
# `crate-type = ["staticlib", "cdylib", "rlib"]`. `loca-core-ffi` is an rlib for
# the same reason: on mobile THIS crate is the staticlib, so declaring another
# one would either need a hand-written C ABI between two Rust crates or archive
# the Core on every desktop build. See D-004 and D-135.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# `local-inference` is enabled HERE rather than in the ffi crate's own defaults,
# and this block is the reason it can be: it is already gated to the two mobile
# targets, so the feature turns on exactly where the app ships and stays off for
# every host build (this crate's clippy, the ffi crate's tests, any
# workspace-wide cargo invocation) where `vendor/llama.cpp` may not exist.
#
# Without it the phone embeds a Core with NO engine: `provider_for` falls back to
# `HttpProvider` against `http://127.0.0.1:7701/v1`, where nothing listens now
# that the sidecar is gone, so every local turn fails with a connection error on
# a build that was supposed to run the model itself. That is the whole objective
# of the mobile half of the port, so it is not a default worth inheriting.
# `local-speech` rides along for the same reason and with the same gating. It
# needs `vendor/sherpa-onnx` staged by `scripts/vendor-sherpa.ts` and
# `SHERPA_ONNX_LIB_DIR` pointed at the right per-target directory, both of which
# the mobile build tasks do; a host build never reaches this block and so never
# needs either. Without it the phone embeds a Core whose `/api/v1/health`
# capabilities report `localSpeech: false` and whose STT and TTS work only
# against an external endpoint, which on a phone is the feature people came for.
loca-core-ffi = { path = "../../../loca-core-ffi", features = ["local-inference", "local-speech"] }

# Android has no keyring-core OS backend, so both on-device secret stores (this
# crate's paired-core bearer tokens and the embedded Core's vault master key)
# are sealed with an AES-256-GCM key held in the AndroidKeyStore. The KeyStore is
# reachable only through the JVM, so this is the crate that owns the JNI: see
# `commands/keychain.rs` and `SecretBox.kt`.
#
# `jni` 0.21 rather than 0.22: the workspace lock already carries BOTH, 0.21.1
# pulled by the Tauri Android stack (tao/wry) and 0.22.4 arriving separately, so
# neither pin adds a first copy. Matching the Tauri stack keeps one of the two
# from becoming a third.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Hands back the JavaVM and the Activity the runtime already holds. The Activity
# is what makes app classes resolvable: a JNI `FindClass` from a Rust-created
# thread searches the SYSTEM classloader, which cannot see `com.rzkyif.loca.*`.
ndk-context = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# Desktop-only plugins and native crates. The updater plugin has no Android
# support (mobile self-updates via a hosted APK + install intent), autostart and
# global-shortcut are desktop concepts, and xcap / cpvc / font-kit / anytomd /
# pdf-extract back desktop-only features (screen capture, volume ducking, font
# enumeration, file-to-markdown conversion) that the mobile impl stubs out.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# LAN core discovery: enumerate this machine's IPv4 interface addresses so the
# pairing sweep knows which /24 to probe (see commands/net.rs discover_lan_cores).
local-ip-address = "0.6"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
anytomd = "1.3.0"
pdf-extract = "0.12.0"
xcap = "0.9.6"
cpvc = "0.6"
font-kit = "0.14"

[dev-dependencies]
rcgen = "=0.14.8"
tempfile = "=3.27.0"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

