[package]
name = "loca-core-ffi"
version = "0.1.0"
edition = "2021"
description = "The mobile frontend to Loca Core: boots the core in process inside the Tauri app and marshals HTTP and WebSocket traffic across the Tauri command boundary, so the phone embeds the real core rather than a reimplementation of it. Desktop builds never link it."
publish = false

[lib]
# rlib, not staticlib: on mobile the Tauri crate is already the staticlib, and
# this crate's only consumer is Rust, so declaring one here would need a
# hand-written C ABI between two Rust crates. The mobile target gate on the
# dependency edge is what keeps a desktop build from linking any of this.
crate-type = ["rlib"]

[features]
# Forwards the core's in-process llama.cpp. Off by default because
# `vendor/llama.cpp` is a gitignored clone and CI builds from fresh checkouts;
# the Tauri crate enables it inside its `cfg(any(android, ios))` block, so it is
# on exactly where the artifact ships.
local-inference = ["loca-core/local-inference"]

# The same, for in-process Whisper STT and Kokoro TTS, off for the same reason.
# `sherpa-onnx-sys`'s prebuilt table covers only linux, macos and windows and
# panics elsewhere; `SHERPA_ONNX_LIB_DIR` short-circuits both the download and
# the target match, so `scripts/vendor-sherpa.ts` stages the upstream android
# and ios artifacts and the mobile builds point at them.
local-speech = ["loca-core/local-speech"]

[dependencies]
loca-core = { package = "loca-core-rs", path = "../loca-core-rs" }
# The command boundary is JSON, and a body is arbitrary bytes, so it crosses as
# base64 exactly as `net_fetch`'s does. Same pin as the core's.
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
# `rt` for the one spawned task per WebSocket connection, `sync` for the
# start-once cell and the per-connection channel. No `rt-multi-thread`: this
# crate never builds a runtime, it runs on the Tauri app's.
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
# `in-memory` exposes `loca_core::transport::testing`, so the pump and
# marshalling tests drive a real router rather than a double. A dev-dependency
# feature never reaches the shipped mobile artifact.
loca-core = { package = "loca-core-rs", path = "../loca-core-rs", features = ["in-memory"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
