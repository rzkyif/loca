[package]
name = "loca-core-hwinfo"
version = "0.1.0"
edition = "2021"
description = "Hardware-introspection helper for loca-core. Prints a small JSON blob (total/available RAM, physical CPU cores, GPU backend + VRAM, unified-memory flag) on stdout so the Deno core can size local models to the device without native FFI. Standalone binary alongside the keychain/updater helpers."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Vulkan bindings that dynamically load the system Vulkan loader at runtime (via
# libloading); no Vulkan SDK is needed at build time, so this compiles on
# CI/driver hosts without any GPU. Used only to detect a Vulkan-capable GPU
# (e.g. Intel) that the vendor probes (nvidia-smi/rocm-smi) miss.
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
