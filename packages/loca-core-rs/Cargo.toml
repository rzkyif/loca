[package]
name = "loca-core-rs"
version = "0.1.0"
edition = "2021"
description = "Loca Core: the local-first AI service. One library hosting sessions, chat, settings, memories, models, inference and speech, with a desktop service binary frontend and a mobile staticlib frontend so the phone embeds the real core rather than a reimplementation of it."
publish = false

[lib]
name = "loca_core"
# rlib only: the mobile staticlib/cdylib is the separate `loca-core-ffi` crate,
# so a desktop build never archives llama.cpp and sherpa-onnx for nothing.
crate-type = ["rlib"]

[[bin]]
name = "loca-core"
path = "src/bin/loca-core.rs"

[features]
# Test doubles for the OS keychain, so the secrets suite never touches the real
# one. Off in production builds, which excludes them from the binary.
in-memory = []

# Compiles and links llama.cpp for in-process inference. OFF by default because
# `vendor/llama.cpp` is a gitignored clone: a fresh checkout must still build.
local-inference = []

# Links sherpa-onnx for in-process Whisper STT and Kokoro TTS. OFF by default
# because `sherpa-onnx-sys` downloads a prebuilt archive when
# `SHERPA_ONNX_LIB_DIR` is unset, so a fresh checkout must still build. That is a
# build-time fetch of a build dependency, not the shipped binary reaching out.
local-speech = ["dep:sherpa-onnx"]

[build-dependencies]
# Unconditional rather than feature-gated: `build.rs` must compile on every
# build, and only skips the work on `CARGO_FEATURE_LOCAL_INFERENCE`.
cmake = "0.1"
cc = "1.2"

[dependencies]
# Pinned exact so this crate, CI, and any staged prebuilt lib agree on one
# version; `default-features` off so the link mode is selected, not inherited.
sherpa-onnx = { version = "=1.13.8", default-features = false, optional = true }

# The WAV decoder in `speech::local::wav`. Unconditional: decoding in Rust
# rather than handing sherpa a path is containment (sherpa's C++ calls `exit()`
# on bad input, which in process takes the whole Core down).
hound = "3"

# The one outbound HTTP client, shared by every package that talks to an
# external endpoint. `rustls` expands to `__rustls-aws-lc-rs` plus
# `rustls-platform-verifier`: aws-lc-rs is the same backend the listener installs
# in `transport/server.rs`, and OS trust roots are what honours a private CA the
# user has already installed (the only option on mobile).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "multipart",
  "stream",
  "http2",
  "charset",
  "system-proxy",
] }
# The MCP client, from the official `modelcontextprotocol/rust-sdk`.
# `transport-child-process` is deliberately absent: it brings its own spawn path,
# where `sidecars::process` already owns Job Object membership, the env allowlist
# and graceful terminate. Stdio is built over the child's pipes with
# `transport-async-rw` instead.
rmcp = { version = "3.1.2", default-features = false, features = [
  "client",
  "transport-async-rw",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
  "auth",
] }
# The secrets vault: AES-GCM-256 over the `secrets.enc` bag.
aes-gcm = { version = "0.11", features = ["std"] }
# CPace, hand-implemented over ristretto255 because no published crate targets
# draft-21. `argon2` drops `password-hash`: the on-disk format is not PHC.
async-trait = "0.1"
argon2 = { version = "0.6", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1", default-features = false, features = [
  "alloc",
  "precomputed-tables",
  "zeroize",
] }
base64 = "0.23"
# Verifies the Ed25519 signature on the model catalog and the release manifests.
ed25519-dalek = "2"
# axum's Router is a `tower::Service`, the seam the mobile in-process path calls
# directly, so no socket and no bound port on a phone.
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
file-rotate = "0.8"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
hyper = "1"
hyper-util = "0.1"
indexmap = "2"
keyring-core = "1"
# The TLS SPKI pin is byte-exact for already-paired clients, so key handling is
# explicit. `arithmetic` provides `SecretKey::public_key()` and is a default
# feature; `ecdsa` stays off since rcgen does the signing.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
rand = "0.10"
rcgen = "=0.14.10"
regex = "1"
# The generated contract compiles Zod `.regex()` constraints into
# `regress::Regex` checks inside `Deserialize`.
regress = "0.12"
# `bundled` is mobile-critical: the Android NDK sysroot has no libsqlite3, and
# it pins one SQLite version across every target. default-features off drops
# 0.40's `ffi-sqlite-wasm-rs`; `cache` is re-added for `prepare_cached`.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# sha1 is the legacy npm integrity arm: old packages publish `dist.shasum` with
# no `dist.integrity`, and without it the installer refuses them. sha2 is pinned
# to 0.10, not 0.11, because CPace needs `Hmac<Sha512>` from the `digest 0.10`
# generation `hmac 0.12` is built on.
sha1 = "0.11"
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "net",
  "io-util",
  "signal",
  "process",
] }
tokio-rustls = "0.26"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# npm tarballs are `.tgz`; `unpack_in` refuses `..` and absolute paths.
tar = "0.4"
flate2 = "1"
# Gitignore matching for the extension content hash. Hand-rolled precedence
# would change which files are hashed, drifting every installed extension.
ignore = "0.4"
# Tool-argument validation against the author's JSON Schema.
jsonschema = { version = "0.59", default-features = false }
# Cancellation for in-flight transfers.
tokio-util = { version = "0.7", default-features = false }
# The `deno` release asset is a `.zip` on every triple. `deflate` only: the
# other codecs would pull in bzip2/zstd/lzma for archives this core never opens.
zip = { version = "4", default-features = false, features = ["deflate"] }

# OS keychain backends, split per platform. iOS takes `protected`, not
# `keychain`.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

# The Vulkan probe behind GPU detection. Listed per-platform rather than
# `not(macos)` so it never links into the mobile staticlib. `loaded` keeps it a
# runtime dlopen, so a machine with no Vulkan driver still starts.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }

# Android links sherpa-onnx SHARED because that is all upstream ships for it
# (there is no static android archive). The two bundled `.so` files are signed
# APK payload, not downloaded code, so W^X does not apply. iOS is absent on
# purpose: upstream's iOS build is static and takes the crate's default mode.
[target.'cfg(target_os = "android")'.dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = [
  "shared",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "net",
  "io-util",
  "test-util",
] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
x509-parser = "=0.18.1"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

# Sidecar supervision needs a real SIGTERM (tokio's `start_kill` is SIGKILL-only)
# and, on Windows, a Job Object so a killed core leaves no tool workers behind.
[target.'cfg(unix)'.dependencies]
# `signal` reaps children; `fs`/`process`/`term` are the PTY host (openpty).
nix = { version = "0.31", features = ["fs", "process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
# ConPTY for the PTY host.
portable-pty = "0.9"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # `CreateJobObjectW`'s signature names `Security::SECURITY_ATTRIBUTES`, which
  # `Win32_System_JobObjects` does not itself enable.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
